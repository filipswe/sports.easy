services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: sports_easy
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sports_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sports -d sports_easy']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sports:${POSTGRES_PASSWORD}@db:5432/sports_easy
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sports:${POSTGRES_PASSWORD}@db:5432/sports_easy
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sports:${POSTGRES_PASSWORD}@db:5432/sports_easy
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./web
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
volumes:
  sports_db:
